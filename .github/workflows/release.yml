name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  release:
    outputs:
      release_tag: ${{ steps.publish_release.outputs.release_tag }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Publish single-file app
        run: >
          dotnet publish src/PlcScope.App/PlcScope.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output dist/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "dist/win-x64/*" -DestinationPath "artifacts/PlcScope-win-x64.zip" -Force

      - name: Set up release tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Prepare ZIP checksum and English release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          python .github/scripts/release_assets.py prepare --repository "$env:GITHUB_REPOSITORY" --release-tag "$env:RELEASE_TAG" --asset-name PlcScope-win-x64.zip --zip artifacts/PlcScope-win-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish ZIP and checksum
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag', '--title', "PLC Scope $env:RELEASE_TAG", '--notes-file', 'artifacts/release/release-notes.md',
            'artifacts/release/PlcScope-win-x64.zip', 'artifacts/release/PlcScope-win-x64.zip.sha256')
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  check-published-release:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
