name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Publish single-file app
        run: >
          dotnet publish src/PlcScope.App/PlcScope.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output dist/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "dist/win-x64/*" -DestinationPath "artifacts/PlcScope-win-x64.zip" -Force

      - name: Publish GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/PlcScope-win-x64.zip

      - name: VirusTotal GitHub Action analysis
        uses: cssnr/virustotal-action@v1
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          file_globs: artifacts/PlcScope-win-x64.zip
          release_id: ${{ steps.release.outputs.id }}
          release_heading: "### VirusTotal GitHub Action analysis:"
